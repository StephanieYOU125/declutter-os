<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#59636f">
  <title>房間物品整理助手</title>
  <style>
    :root{--bg:#f4f5f6;--card:#fff;--text:#24272b;--muted:#6d737a;--line:#dfe2e5;--accent:#59636f;--accent2:#eef0f2;--keep:#e8f4ec;--out:#f8ecea;--pending:#f6f0df}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}
    header{padding:22px 18px;background:var(--card);border-bottom:1px solid var(--line)}header h1{margin:0;font-size:24px}header p{margin:7px 0 0;color:var(--muted);font-size:14px}
    main{max-width:860px;margin:auto;padding:18px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:16px}.stat{padding:14px}.stat strong{font-size:25px;display:block}.stat span{font-size:13px;color:var(--muted)}
    nav{display:flex;gap:8px;margin:16px 0;flex-wrap:wrap}button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;color:var(--text)}button.primary,.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}button.danger{color:#9d3028}
    .card{padding:18px;margin-bottom:14px}.card h2{font-size:19px;margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}label{display:block;font-size:13px;color:var(--muted)}input,select,textarea{width:100%;margin-top:5px;border:1px solid #cfd3d7;border-radius:11px;padding:11px;background:#fff;color:var(--text);font:inherit}textarea{resize:vertical}.full{grid-column:1/-1}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.notice{padding:12px 14px;border-radius:12px;background:var(--accent2);font-size:14px}.hidden{display:none!important}
    .item{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.item-title{font-weight:650}.meta,.small{font-size:13px;color:var(--muted);margin-top:4px}.badge{display:inline-block;border-radius:999px;padding:4px 9px;font-size:12px;white-space:nowrap}.badge.保留{background:var(--keep)}.badge.捐贈,.badge.出售,.badge.丟棄{background:var(--out)}.badge.待判斷,.badge.再想想{background:var(--pending)}
    .review-title{font-size:25px;margin:8px 0 4px}.question-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.decision-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.recommendation{background:var(--accent2);border-left:4px solid var(--accent);padding:13px;border-radius:9px}.toolbar{display:grid;grid-template-columns:2fr 1fr;gap:10px}.empty{text-align:center;color:var(--muted);padding:24px 10px}footer{text-align:center;color:var(--muted);font-size:12px;padding:12px}
    @media(max-width:650px){main{padding:12px}.stats{grid-template-columns:repeat(2,1fr)}.grid,.question-grid,.toolbar{grid-template-columns:1fr}.decision-grid{grid-template-columns:repeat(2,1fr)}.full{grid-column:auto}.item{align-items:flex-start}}
  </style>
</head>
<body>
<header><h1>房間物品整理助手</h1><p>先快速記錄房間裡有什麼，再逐件判斷是否保留、捐贈、出售或丟棄。</p></header>
<main>
  <section class="stats" aria-live="polite">
    <div class="stat"><strong id="statTypes">0</strong><span>物品種類</span></div><div class="stat"><strong id="statQty">0</strong><span>物品總數</span></div><div class="stat"><strong id="statPending">0</strong><span>待判斷</span></div><div class="stat"><strong id="statOut">0</strong><span>準備移出</span></div>
  </section>
  <nav><button class="tab active" data-tab="record">① 邊整理邊記錄</button><button class="tab" data-tab="review">② 逐件判斷</button><button class="tab" data-tab="list">③ 查看清單</button></nav>
  <section id="recordPanel">
    <div class="notice">建議一次只打開一個紙箱。看到一樣東西就先登記，不必立刻決定要不要丟。</div>
    <div class="card" style="margin-top:14px"><h2>快速新增物品</h2><div class="grid">
      <label>物品名稱 *<input id="name" placeholder="例如：冬季外套"></label><label>分類<select id="category"><option>衣物</option><option>書籍文件</option><option>3C用品</option><option>生活用品</option><option>保養化妝品</option><option>食品藥品</option><option>紀念品</option><option>運動用品</option><option>其他</option></select></label>
      <label>數量<input id="quantity" type="number" min="1" value="1"></label><label>目前位置<input id="location" placeholder="例如：紙箱A、床下"></label><label>物品狀況<select id="condition"><option>良好</option><option>普通</option><option>損壞</option><option>未檢查</option></select></label><label>保存期限<input id="expiry" type="date"></label><label class="full">備註<textarea id="notes" rows="2" placeholder="例如：可能重複購買、很久沒用"></textarea></label>
    </div><div class="actions"><button id="addContinue" class="primary">加入並繼續整理</button><button id="addView">加入後查看清單</button></div><div id="feedback" class="small" aria-live="polite"></div></div>
    <div class="card"><h2>最近新增</h2><div id="recent"></div></div>
  </section>
  <section id="reviewPanel" class="hidden"><div id="reviewEmpty" class="card empty hidden">目前沒有待判斷的物品。</div><div id="reviewCard" class="card">
    <div class="small" id="reviewProgress"></div><span class="badge 待判斷" id="reviewCategory"></span><div class="review-title" id="reviewName"></div><div class="meta" id="reviewMeta"></div>
    <div class="question-grid" style="margin-top:18px"><label>過去一年有使用嗎？<select id="used"><option value="unknown">不確定</option><option value="yes">有</option><option value="no">沒有</option></select></label><label>家裡有重複的嗎？<select id="duplicate"><option value="unknown">不確定</option><option value="yes">有</option><option value="no">沒有</option></select></label><label>未來半年會使用嗎？<select id="future"><option value="unknown">不確定</option><option value="yes">會</option><option value="no">不會</option></select></label><label>有重要或紀念價值嗎？<select id="important"><option value="unknown">不確定</option><option value="yes">有</option><option value="no">沒有</option></select></label></div>
    <div id="recommendation" class="recommendation" style="margin-top:16px">回答問題後，系統會提供去留建議。</div><h2 style="margin-top:20px">最後由你決定</h2><div class="decision-grid"><button data-decision="保留">保留</button><button data-decision="捐贈">捐贈</button><button data-decision="出售">出售</button><button data-decision="丟棄">丟棄</button><button data-decision="再想想">再想想</button></div>
  </div></section>
  <section id="listPanel" class="hidden"><div class="card"><div class="toolbar"><label>搜尋<input id="search" placeholder="搜尋名稱、位置、備註"></label><label>去留狀態<select id="filter"><option value="全部">全部</option><option>待判斷</option><option>保留</option><option>捐贈</option><option>出售</option><option>丟棄</option><option>再想想</option></select></label></div><div id="allItems" style="margin-top:12px"></div><div class="actions"><button id="exportCsv">匯出 CSV</button><button id="exportJson">備份資料</button><label style="display:inline-block"><span style="display:inline-block;border:1px solid var(--line);border-radius:12px;padding:10px 14px;color:var(--text);cursor:pointer">匯入備份</span><input id="importJson" type="file" accept=".json,application/json" style="display:none"></label><button id="clearAll" class="danger">清空資料</button></div></div></section>
</main>
<footer>資料只儲存在目前使用的瀏覽器；建議定期下載備份。</footer>
<script>
  const KEY="room_sorting_webapp_v2";let items=JSON.parse(localStorage.getItem(KEY)||"[]");let reviewIndex=0;const $=id=>document.getElementById(id);
  function save(){localStorage.setItem(KEY,JSON.stringify(items));renderAll()}function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
  function switchTab(tab){["record","review","list"].forEach(x=>$(x+"Panel").classList.toggle("hidden",x!==tab));document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));if(tab==="review")renderReview();if(tab==="list")renderList()}
  function addItem(goList=false){const name=$("name").value.trim();if(!name){$("feedback").textContent="請先輸入物品名稱。";$("name").focus();return}items.unshift({id:uid(),name,category:$("category").value,quantity:Math.max(1,Number($("quantity").value||1)),location:$("location").value.trim(),condition:$("condition").value,expiry:$("expiry").value,notes:$("notes").value.trim(),decision:"待判斷",answers:{},createdAt:new Date().toISOString()});const location=$("location").value;$("name").value="";$("quantity").value=1;$("condition").value="良好";$("expiry").value="";$("notes").value="";$("location").value=location;$("feedback").textContent="已加入，請繼續整理下一件。";save();$("name").focus();if(goList)switchTab("list")}
  function renderStats(){$("statTypes").textContent=items.length;$("statQty").textContent=items.reduce((s,x)=>s+Number(x.quantity||0),0);$("statPending").textContent=items.filter(x=>["待判斷","再想想"].includes(x.decision)).length;$("statOut").textContent=items.filter(x=>["捐贈","出售","丟棄"].includes(x.decision)).length}
  function itemHtml(x,controls=false){return `<div class="item" data-id="${x.id}"><div><div class="item-title">${esc(x.name)}</div><div class="meta">${esc(x.category)} · ${x.quantity}件 · ${esc(x.location||"位置未填")} · ${esc(x.condition)}</div>${x.notes?`<div class="small">${esc(x.notes)}</div>`:""}</div><div style="text-align:right"><span class="badge ${esc(x.decision)}">${esc(x.decision)}</span>${controls?`<div style="margin-top:7px"><button class="deleteBtn danger">刪除</button></div>`:""}</div></div>`}
  function renderRecent(){$("recent").innerHTML=items.length?items.slice(0,5).map(x=>itemHtml(x)).join(""):'<div class="empty">尚未新增物品。</div>'}function pending(){return items.filter(x=>["待判斷","再想想"].includes(x.decision))}function current(){const p=pending();if(!p.length)return null;reviewIndex=Math.min(reviewIndex,p.length-1);return p[reviewIndex]}
  function advice(x){const a=x.answers||{},now=new Date(),expiry=x.expiry?new Date(x.expiry+"T00:00:00"):null;if(expiry&&expiry<now)return"建議：已超過保存期限，請優先確認是否丟棄或依規定回收。";if(x.condition==="損壞"&&a.important!=="yes")return"建議：物品已損壞且沒有重要價值，可以考慮丟棄或回收。";if(a.important==="yes")return"建議：有重要或紀念價值，可以保留，但要安排固定位置。";if(a.used==="yes"||a.future==="yes")return"建議：近期仍有使用需求，可以保留並指定收納位置。";if(a.duplicate==="yes"&&x.condition==="良好")return"建議：已有重複物品，狀況良好，可優先捐贈或出售。";if(a.used==="no"&&a.future==="no")return"建議：長期沒有使用，未來也沒有需求，可考慮捐贈、出售或丟棄。";return"建議：資訊仍不足，可以先放入「再想想箱」，一個月後再次判斷。"}
  function updateAnswers(){const x=current();if(!x)return;x.answers={used:$("used").value,duplicate:$("duplicate").value,future:$("future").value,important:$("important").value};$("recommendation").textContent=advice(x);localStorage.setItem(KEY,JSON.stringify(items))}
  function renderReview(){const x=current(),empty=!x;$("reviewEmpty").classList.toggle("hidden",!empty);$("reviewCard").classList.toggle("hidden",empty);if(!x)return;const p=pending();$("reviewProgress").textContent=`第 ${reviewIndex+1} 件／共 ${p.length} 件待判斷`;$("reviewCategory").textContent=x.category;$("reviewName").textContent=x.name;$("reviewMeta").textContent=`${x.quantity}件 · ${x.location||"位置未填"} · ${x.condition}`;$("used").value=x.answers?.used||"unknown";$("duplicate").value=x.answers?.duplicate||"unknown";$("future").value=x.answers?.future||"unknown";$("important").value=x.answers?.important||"unknown";$("recommendation").textContent=advice(x)}
  function decide(value){const x=current();if(!x)return;updateAnswers();x.decision=value;if(reviewIndex>=pending().length)reviewIndex=Math.max(0,pending().length-1);save();renderReview()}
  function renderList(){const q=$("search").value.trim().toLowerCase(),f=$("filter").value;const shown=items.filter(x=>{const h=[x.name,x.category,x.location,x.notes].join(" ").toLowerCase();return(!q||h.includes(q))&&(f==="全部"||x.decision===f)});$("allItems").innerHTML=shown.length?shown.map(x=>itemHtml(x,true)).join(""):'<div class="empty">沒有符合條件的物品。</div>';document.querySelectorAll(".deleteBtn").forEach(b=>b.addEventListener("click",e=>{const id=e.target.closest("[data-id]").dataset.id;if(confirm("確定刪除這筆物品紀錄嗎？")){items=items.filter(x=>x.id!==id);save();renderList()}}))}
  function download(name,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;a.click();URL.revokeObjectURL(url)}
  function exportCsv(){const heads=["物品名稱","分類","數量","目前位置","物品狀況","保存期限","去留決定","備註"];const quote=v=>`"${String(v??"").replaceAll('"','""')}"`;const rows=items.map(x=>[x.name,x.category,x.quantity,x.location,x.condition,x.expiry,x.decision,x.notes].map(quote).join(","));download("房間物品清單.csv","\uFEFF"+[heads.map(quote).join(","),...rows].join("\n"),"text/csv;charset=utf-8")}
  function renderAll(){renderStats();renderRecent();if(!$("reviewPanel").classList.contains("hidden"))renderReview();if(!$("listPanel").classList.contains("hidden"))renderList()}
  document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>switchTab(b.dataset.tab)));$("addContinue").addEventListener("click",()=>addItem(false));$("addView").addEventListener("click",()=>addItem(true));$("name").addEventListener("keydown",e=>{if(e.key==="Enter")addItem(false)});["used","duplicate","future","important"].forEach(id=>$(id).addEventListener("change",updateAnswers));document.querySelectorAll("[data-decision]").forEach(b=>b.addEventListener("click",()=>decide(b.dataset.decision)));$("search").addEventListener("input",renderList);$("filter").addEventListener("change",renderList);$("exportCsv").addEventListener("click",exportCsv);$("exportJson").addEventListener("click",()=>download("房間物品備份.json",JSON.stringify(items,null,2),"application/json"));$("importJson").addEventListener("change",e=>{const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const data=JSON.parse(r.result);if(!Array.isArray(data))throw Error();if(confirm(`匯入 ${data.length} 筆資料並取代目前資料？`)){items=data;save()}}catch{alert("備份檔格式不正確。")}e.target.value=""};r.readAsText(file)});$("clearAll").addEventListener("click",()=>{if(items.length&&confirm("確定清空全部資料嗎？")){items=[];save()}});renderAll();
</script>
</body>
</html>
